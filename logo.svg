<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 82 110" overflow="visible">
  <defs>
    <linearGradient id="g" x1="2" y1="10" x2="70" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffe05a"/>
      <stop offset="38%"  stop-color="#f5a200"/>
      <stop offset="100%" stop-color="#bf7800"/>
    </linearGradient>
  </defs>
  <!--
    Two-horn cap (left horn lower, right horn higher) + V-notch between them
    then Z-diagonal down to middle step, then spike to bottom
  -->
  <path
    d="M 2,46 L 18,24 L 36,40 L 80,10 L 67,38 L 27,60 L 57,60 L 70,106 L 46,80 L 22,80 L 20,48 Z"
    fill="url(#g)"
  />
  <!-- Primary lightning vein -->
  <polyline
    points="30,28 25,52 38,52 33,74 45,104"
    stroke="white" stroke-width="1.1" stroke-opacity="0.55"
    stroke-linejoin="round" fill="none"/>
  <!-- Secondary veins -->
  <line x1="50" y1="14" x2="65" y2="36" stroke="white" stroke-width="0.7" stroke-opacity="0.35"/>
  <line x1="48" y1="62" x2="55" y2="88" stroke="white" stroke-width="0.7" stroke-opacity="0.38"/>
</svg>
